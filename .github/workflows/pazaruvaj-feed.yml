name: Pazaruvaj XML feed

on:
  schedule:
    - cron: "20 * * * *"   # всеки час, в хх:20 (след синхронизацията с дистрибутора)
  workflow_dispatch:        # бутон "Run workflow" за ръчно пускане

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pazaruvaj-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Генериране на XML
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE || vars.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN || vars.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID || vars.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET || vars.SHOPIFY_CLIENT_SECRET }}
          # ---- Настройки (сменете стойностите в кавичките при нужда) ----
          DELIVERY_TIME: ""           # срок за доставка в дни (празно = не се посочва)
          DELIVERY_COST: "Free"       # безплатна доставка
          ONLY_IN_STOCK: "1"          # 1 = само продукти с наличност
          PRODUCT_NUMBER: "auto"      # кодът на производителя се търси сам
          VAT_RATE: "20"
          UTM: "utm_source=pazaruvaj&utm_medium=cpc"
        run: |
          echo "Проверка на ключовете (стойностите не се показват):"
          for k in SHOPIFY_STORE SHOPIFY_ACCESS_TOKEN SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET; do
            if [ -n "${!k}" ]; then echo "  $k - има"; else echo "  $k - НЯМА"; fi
          done
          python pazaruvaj_feed.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      # Публикуване. GitHub понякога не "вижда" качения файл веднага,
      # затова при неуспех изчакваме и опитваме пак (до 3 пъти).
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Изчакване преди втори опит
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Изчакване преди трети опит
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
